function gallery(){const m=galleryImages[galleryIndex];return '<div class="gallery-heading"><div><p class="eyebrow">Квартира у парка / Альбом проекта</p><h1>Пространство в деталях</h1><p class="note">Свет, фактуры и настроение вашего будущего интерьера.</p></div><button class="button" data-view="client">'+icon('arrow-left')+' Обзор проекта</button></div><section class="gallery-frame"><div class="gallery-top"><span>ВИЗУАЛИЗАЦИИ / '+String(galleryIndex+1).padStart(2,'0')+'</span><span>'+ (galleryIndex===0?'Версия 2 · '+status():'Версия 1 · Согласовано')+'</span></div><div class="gallery-main"><button class="icon-button" data-action="gallery-prev" aria-label="Предыдущее изображение">'+icon('chevron-left')+'</button><button class="gallery-picture" data-action="gallery-zoom" aria-label="Открыть '+m.name+' на весь экран">'+im(m.url,m.name)+'<span class="gallery-enlarge">'+icon('expand')+' Рассмотреть детали</span></button><button class="icon-button" data-action="gallery-next" aria-label="Следующее изображение">'+icon('chevron-right')+'</button></div><div class="gallery-bottom"><div><h2>'+m.name+'</h2><p>'+m.room+'</p></div><div class="gallery-thumbs" aria-label="Выбрать ракурс">'+galleryImages.map((g,i)=>'<button class="gallery-thumb '+(i===galleryIndex?'active':'')+'" data-action="gallery-select" data-index="'+i+'" aria-label="'+g.name+'" aria-pressed="'+(i===galleryIndex)+'">'+im(g.url,g.name)+'</button>').join('')+'</div></div></section><div class="gallery-note"><p class="note">Откройте изображение, чтобы увеличить детали. Обсуждение и решение доступны в карточке выбранного материала.</p><button class="button primary" data-action="gallery-material">'+(galleryIndex===0&&pending()?'Обсудить и согласовать':'Открыть материал')+' '+icon('arrow-up-right')+'</button></div>'+foot()}
function render(){const app=document.getElementById('app');app.classList.toggle('is-admin',view==='admin');app.classList.toggle('is-material',view==='material');app.classList.toggle('is-gallery',view==='gallery');document.querySelectorAll('.demo-views button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view))});document.getElementById('sidebar-nav').innerHTML=navHTML();document.getElementById('horizontal-nav').innerHTML=navItems().map(([l,i,d])=>'<button class="'+(d===view?'active':'')+'" data-nav="'+d+'">'+l+(d==='material'&&pending()?' · 1':'')+'</button>').join('');document.getElementById('bottom-nav').innerHTML=navHTML('');const adminRole=view==='admin';['sidebar-person','header-person'].forEach(id=>document.getElementById(id).textContent=adminRole?'Анна Морозова':'Мария Соколова');['sidebar-role','header-role'].forEach(id=>document.getElementById(id).textContent=adminRole?'Администратор':'Заказчик');document.getElementById('header-avatar').textContent=adminRole?'АМ':'МС';document.getElementById('location-label').textContent=adminRole?'Рабочее пространство студии':'Квартира у парка';document.querySelector('.sidebar .caption').textContent=adminRole?'Рабочее пространство':'Личный кабинет';document.querySelector('.sidebar .avatar').textContent=adminRole?'АМ':'МС';document.getElementById('screen').innerHTML=view==='admin'?admin():view==='material'?material():view==='gallery'?gallery():clientC();bindInputs();document.querySelector('.review-canvas .preview-image')?.addEventListener('click',()=>openViewer(materialIndex));}
function switchView(next){if(!['client','admin','material','gallery'].includes(next))return;view=next;document.getElementById('notifications').hidden=true;closeDrawer();if(location.hash!=='#'+next)history.replaceState(null,'','#'+next);render();window.scrollTo({top:0});}
function openDiscussion(){const old=materialIndex===0&&version===1,m=galleryImages[materialIndex];showModal(dialogHead('Обсуждение материала')+'<div class="comment-sheet-context">'+im(m.url,m.name)+'<div><strong>'+m.name+'</strong><p class="fine">Версия '+(materialIndex===0?version:1)+(old?' · история':' · текущая')+'</p></div></div><div class="sheet-comments">'+materialDiscussion(old)+'</div>'+(materialIndex===0&&!old?'<form id="sheet-form"><label for="sheet-text" class="fine">Ваш комментарий к версии 2</label><textarea id="sheet-text" class="field" maxlength="1500" placeholder="Что вы хотели бы уточнить?" required></textarea><div class="modal-actions"><button type="button" class="button" data-action="close-modal">Отмена</button><button class="button primary">Отправить</button></div></form>':'<p class="note">'+(old?'История версии доступна только для просмотра.':'Обсуждение согласованного материала сохранено.')+'</p>'));const embedded=document.querySelector('#modal #comment-form');embedded?.remove();document.getElementById('sheet-form')?.addEventListener('submit',e=>{e.preventDefault();const value=document.getElementById('sheet-text').value.trim();if(!value)return;userComments.push(value);closeModal();render();toast('Комментарий добавлен к версии 2 в демо.');});}
function openViewer(index){galleryIndex=index;viewerReturn=document.activeElement;viewerScale=1;viewerX=viewerY=0;let v=document.getElementById('image-viewer');if(!v){v=document.createElement('div');v.id='image-viewer';document.getElementById('app').appendChild(v)}v.className='viewer-overlay';v.setAttribute('role','dialog');v.setAttribute('aria-modal','true');v.setAttribute('aria-labelledby','viewer-title');v.hidden=false;document.body.style.overflow='hidden';drawViewer();}
function drawViewer(){const m=galleryImages[galleryIndex],v=document.getElementById('image-viewer');v.innerHTML='<div class="viewer-head"><div><strong id="viewer-title">'+m.name+'</strong><p>Квартира у парка · версия '+m.version+'</p></div><button class="icon-button" data-action="viewer-close" aria-label="Закрыть изображение">'+icon('x')+'</button></div><div id="viewer-stage" class="viewer-stage">'+im(m.url,m.name,'viewer-image')+'<span class="viewer-hint">Разведите пальцы или нажмите + для увеличения</span></div><div class="viewer-foot"><div class="viewer-controls"><button class="icon-button" data-action="viewer-prev" aria-label="Предыдущее изображение">'+icon('chevron-left')+'</button><span class="viewer-count">'+(galleryIndex+1)+' / 3</span><button class="icon-button" data-action="viewer-next" aria-label="Следующее изображение">'+icon('chevron-right')+'</button></div><div class="viewer-controls"><button class="icon-button" data-action="viewer-minus" aria-label="Уменьшить">'+icon('minus')+'</button><span id="zoom-value">100%</span><button class="icon-button" data-action="viewer-plus" aria-label="Увеличить">'+icon('plus')+'</button><button class="icon-button" data-action="viewer-reset" aria-label="Сбросить масштаб">'+icon('rotate-ccw')+'</button></div><button class="button" data-action="viewer-comment">'+icon('message-square')+' '+(galleryIndex===0?'Оставить замечание':'К материалу')+'</button></div>';bindViewerGestures();updateViewerTransform();v.querySelector('button').focus();}
function updateViewerTransform(){viewerScale=Math.max(1,Math.min(4,viewerScale));const stage=document.getElementById('viewer-stage');if(!stage)return;const maxX=stage.clientWidth*(viewerScale-1)/2,maxY=stage.clientHeight*(viewerScale-1)/2;viewerX=Math.max(-maxX,Math.min(maxX,viewerX));viewerY=Math.max(-maxY,Math.min(maxY,viewerY));stage.querySelector('img').style.transform='translate('+viewerX+'px,'+viewerY+'px) scale('+viewerScale+')';document.getElementById('zoom-value').textContent=Math.round(viewerScale*100)+'%';}
function closeViewer(){const v=document.getElementById('image-viewer');if(!v||v.hidden)return;v.hidden=true;document.body.style.overflow='';if(view==='gallery')render();viewerReturn?.focus();}
function changeViewer(step){galleryIndex=(galleryIndex+step+galleryImages.length)%galleryImages.length;viewerScale=1;viewerX=viewerY=0;drawViewer();}
function bindViewerGestures(){const el=document.getElementById('viewer-stage'),points=new Map();let lastDistance=0,lastX=0,lastY=0,startX=0,startY=0,pinchUsed=false,lastTap=0;el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===1){startX=lastX=e.clientX;startY=lastY=e.clientY;pinchUsed=false}else{pinchUsed=true;const[a,b]=[...points.values()];lastDistance=Math.hypot(a.x-b.x,a.y-b.y)}});el.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size===2){const[a,b]=[...points.values()],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastDistance) viewerScale*=d/lastDistance;lastDistance=d}else if(viewerScale>1){viewerX+=e.clientX-lastX;viewerY+=e.clientY-lastY}lastX=e.clientX;lastY=e.clientY;updateViewerTransform()});const finish=e=>{const dx=e.clientX-startX,dy=e.clientY-startY;points.delete(e.pointerId);lastDistance=0;if(points.size===0&&!pinchUsed&&e.type!=='pointercancel'){if(viewerScale===1&&Math.abs(dx)>65&&Math.abs(dx)>Math.abs(dy)){changeViewer(dx<0?1:-1);return}if(Math.abs(dx)<10&&Math.abs(dy)<10){if(Date.now()-lastTap<300){viewerScale=viewerScale>1?1:2;viewerX=viewerY=0;updateViewerTransform();lastTap=0}else lastTap=Date.now()}}};el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);el.addEventListener('wheel',e=>{e.preventDefault();viewerScale+=e.deltaY<0?.2:-.2;updateViewerTransform()},{passive:false});}
document.addEventListener('keydown',e=>{const v=document.getElementById('image-viewer');if(!v||v.hidden)return;if(e.key==='Escape'){e.stopImmediatePropagation();closeViewer()}if(e.key==='ArrowRight')changeViewer(1);if(e.key==='ArrowLeft')changeViewer(-1);if(e.key==='+'||e.key==='='){viewerScale+=.5;updateViewerTransform()}if(e.key==='-'){viewerScale-=.5;updateViewerTransform()}if(e.key==='Tab'){const bs=[...v.querySelectorAll('button')],first=bs[0],last=bs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.action;const actions=['open-current','select-material','zoom','gallery-zoom','gallery-next','gallery-prev','gallery-select','gallery-material','discussion-sheet','viewer-close','viewer-next','viewer-prev','viewer-plus','viewer-minus','viewer-reset','viewer-comment','filter-overdue','project-detail','admin-comment'];if(b.dataset.nav==='gallery'){e.stopImmediatePropagation();switchView('gallery');return}if(!actions.includes(a))return;e.stopImmediatePropagation();switch(a){case'open-current':materialIndex=0;version=2;libraryOpen=false;switchView('material');break;case'select-material':materialIndex=Number(b.dataset.index);version=materialIndex===0?2:1;libraryOpen=false;render();scrollTo(0,0);break;case'zoom':openViewer(materialIndex);break;case'gallery-zoom':openViewer(galleryIndex);break;case'gallery-next':galleryIndex=(galleryIndex+1)%3;render();break;case'gallery-prev':galleryIndex=(galleryIndex+2)%3;render();break;case'gallery-select':galleryIndex=Number(b.dataset.index);render();break;case'gallery-material':materialIndex=galleryIndex;version=materialIndex===0?2:1;libraryOpen=false;switchView('material');break;case'discussion-sheet':openDiscussion();break;case'viewer-close':closeViewer();break;case'viewer-next':changeViewer(1);break;case'viewer-prev':changeViewer(-1);break;case'viewer-plus':viewerScale+=.5;updateViewerTransform();break;case'viewer-minus':viewerScale-=.5;updateViewerTransform();break;case'viewer-reset':viewerScale=1;viewerX=viewerY=0;updateViewerTransform();break;case'viewer-comment':{const i=galleryIndex;closeViewer();materialIndex=i;version=i===0?2:1;libraryOpen=false;switchView('material');if(i===0)openDiscussion();break}case'filter-overdue':filter='overdue';render();document.getElementById('task-search')?.focus();break;case'project-detail':if(Number(b.dataset.index)===0)switchView('client');else infoModal(taskData[Number(b.dataset.index)].project,'Проект в работе. Этап: '+taskData[Number(b.dataset.index)].stage+'.<br><br>Карточка показана как пример организации рабочего пространства.');break;case'admin-comment':materialIndex=0;version=2;libraryOpen=false;switchView('material');openDiscussion();break}},true);

document.addEventListener('click',e=>{const t=e.target.closest('button,[data-action]');if(!t)return;if(t.dataset.view){switchView(t.dataset.view);return}if(t.dataset.nav){const n=t.dataset.nav;if(['client','admin','material','gallery'].includes(n)){switchView(n);return}closeDrawer();if(n==='projects'){infoModal('Проекты','Квартира у парка · В работе · 65%<br>Архив доступен отдельно и не входит в очередь решений.');}else if(n==='tasks'){switchView('admin');document.getElementById('task-search')?.focus()}else if(n==='profile'){infoModal('Мария Соколова','Заказчик · личный кабинет.<br>Это визуальная концепция. Редактирование профиля не подключено.')}else infoModal('Клиенты студии','В этой концепции показаны главная, рабочая очередь и согласование материала.');return}
if(t.dataset.metric){document.querySelectorAll('.metric').forEach(x=>x.classList.toggle('selected',x===t));if(t.dataset.metric==='waiting'){document.getElementById('waiting-section')?.scrollIntoView({block:'start'});toast('Показаны материалы, ожидающие решения заказчика.')}else if(t.dataset.metric==='actions'){filter='all';document.getElementById('task-filter').value='all';document.getElementById('task-rows').innerHTML=workRows();document.getElementById('task-search').focus()}else infoModal('Активные проекты · 8','Квартира у парка<br>Дом в соснах<br>Студия на набережной<br><br>В макете показаны три примера из восьми активных проектов.');return}
switch(t.dataset.action){case'approve':approve();break;case'changes':changes();break;case'confirm-approve':if(version!==2||!pending())return;decision='approved';closeModal();render();toast('Версия 2 согласована в демо. Ожидающих решений: 0.');break;case'confirm-changes':{const f=document.getElementById('changes-text'),text=f.value.trim();if(!text){document.getElementById('changes-error').textContent='Добавьте комментарий — он нужен дизайнеру.';f.setAttribute('aria-invalid','true');f.focus();return}if(version!==2||!pending())return;userComments.push('Запрос на доработку: '+text);decision='changes';closeModal();render();toast('Замечания сохранены в демо. Материал на доработке.');break}case'close-modal':closeModal();break;case'current-version':version=2;render();break;case'reset-decision':decision='pending';render();break;case'back-library':libraryOpen=true;render();scrollTo(0,0);break;case'open-current':libraryOpen=false;version=2;render();scrollTo(0,0);break;case'download':infoModal('Об оригинальном файле','Макет использует иллюстративные материалы. Оригинальный файл проекта здесь не прикреплён.<br><br>В рабочем кабинете скачивание должно сохранять имя и тип выбранной версии: JPG для v2, PDF для v1.');break;case'zoom':showModal('<div class="zoom-head"><strong id="modal-title">Гостиная · версия 2</strong><button class="icon-button" data-action="close-modal" aria-label="Закрыть просмотр">'+icon('x')+'</button></div>'+photo,true);break;case'notifications':document.getElementById('notifications').hidden=!document.getElementById('notifications').hidden;break;case'menu':{const d=document.getElementById('drawer');d.innerHTML='<div class="drawer-content"><div class="drawer-head"><im'+'g class="brand" src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/0a91e369-2692-4bb7-8c12-0055f988924c/brand-assets/itd-official-logo.svg/logo.svg" alt="ITD Studio"><button class="icon-button" data-action="close-menu" aria-label="Закрыть меню">'+icon('x')+'</button></div><nav class="sidebar-nav">'+navHTML()+'</nav><div class="drawer-footer"><p class="fine">Демонстрационная концепция.<br>Рабочий сайт не изменён.</p></div></div>';d.hidden=false;d.classList.add('open');d.querySelector('button').focus();break}case'close-menu':closeDrawer();break;case'contact':switchView('material');document.querySelector('.discussion')?.scrollIntoView();document.getElementById('comment-text')?.focus();break;case'all-waiting':infoModal('Ждём заказчика · 5 материалов','Квартира у парка — визуализация гостиной<br>Дом в соснах — планировка<br>Студия на набережной — отделка<br>Квартира на холме — освещение<br>Дом у озера — концепция');break;case'task':infoModal('Рабочая задача',taskData[Number(t.dataset.index)||0].title+'<br><br>Ответственный и срок показаны в рабочей очереди. Изменения в рабочую систему из макета не отправляются.');break;case'new-task':infoModal('Новая задача','Визуальная концепция показывает расположение действия. Создание задач подключается на этапе реализации.');break;case'stage':infoModal('Этапы проекта','Сейчас параллельно идут визуализации и рабочая документация.<br><br>Требуется одно решение по визуализации гостиной.');break;}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();document.getElementById('notifications').hidden=true}if(e.key==='Tab'&&!document.getElementById('modal').hidden){const items=[...document.querySelectorAll('#modal button,#modal textarea,#modal input')].filter(x=>!x.disabled);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const s=location.hash.slice(1);if(['client','admin','material','gallery'].includes(s))switchView(s)});render();
