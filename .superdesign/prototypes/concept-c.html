document.addEventListener('click',e=>{const t=e.target.closest('button,[data-action]');if(!t)return;if(t.dataset.view){switchView(t.dataset.view);return}if(t.dataset.nav){const n=t.dataset.nav;if(['client','admin','material'].includes(n)){switchView(n);return}closeDrawer();if(n==='projects'){infoModal('Проекты','Квартира у парка · В работе · 65%<br>Архив доступен отдельно и не входит в очередь решений.');}else if(n==='tasks'){switchView('admin');document.getElementById('task-search')?.focus()}else if(n==='profile'){infoModal('Мария Соколова','Заказчик · личный кабинет.<br>Это визуальная концепция. Редактирование профиля не подключено.')}else infoModal('Клиенты студии','В этой концепции показаны главная, рабочая очередь и согласование материала.');return}
if(t.dataset.metric){document.querySelectorAll('.metric').forEach(x=>x.classList.toggle('selected',x===t));if(t.dataset.metric==='waiting'){document.getElementById('waiting-section')?.scrollIntoView({block:'start'});toast('Показаны материалы, ожидающие решения заказчика.')}else if(t.dataset.metric==='actions'){filter='all';document.getElementById('task-filter').value='all';document.getElementById('task-rows').innerHTML=workRows();document.getElementById('task-search').focus()}else infoModal('Активные проекты · 8','Квартира у парка<br>Дом в соснах<br>Студия на набережной<br><br>В макете показаны три примера из восьми активных проектов.');return}
switch(t.dataset.action){case'approve':approve();break;case'changes':changes();break;case'confirm-approve':if(version!==2||!pending())return;decision='approved';closeModal();render();toast('Версия 2 согласована в демо. Ожидающих решений: 0.');break;case'confirm-changes':{const f=document.getElementById('changes-text'),text=f.value.trim();if(!text){document.getElementById('changes-error').textContent='Добавьте комментарий — он нужен дизайнеру.';f.setAttribute('aria-invalid','true');f.focus();return}if(version!==2||!pending())return;userComments.push('Запрос на доработку: '+text);decision='changes';closeModal();render();toast('Замечания сохранены в демо. Материал на доработке.');break}case'close-modal':closeModal();break;case'current-version':version=2;render();break;case'reset-decision':decision='pending';render();break;case'back-library':libraryOpen=true;render();scrollTo(0,0);break;case'open-current':libraryOpen=false;version=2;render();scrollTo(0,0);break;case'download':infoModal('Об оригинальном файле','Макет использует иллюстративные материалы. Оригинальный файл проекта здесь не прикреплён.<br><br>В рабочем кабинете скачивание должно сохранять имя и тип выбранной версии: JPG для v2, PDF для v1.');break;case'zoom':showModal('<div class="zoom-head"><strong id="modal-title">Гостиная · версия 2</strong><button class="icon-button" data-action="close-modal" aria-label="Закрыть просмотр">'+icon('x')+'</button></div>'+photo,true);break;case'notifications':document.getElementById('notifications').hidden=!document.getElementById('notifications').hidden;break;case'menu':{const d=document.getElementById('drawer');d.innerHTML='<div class="drawer-content"><div class="drawer-head"><im'+'g class="brand" src="https://vgbujcuwptvheqijyjbe.supabase.co/storage/v1/object/public/hmac-uploads/projects/0a91e369-2692-4bb7-8c12-0055f988924c/brand-assets/itd-official-logo.svg/logo.svg" alt="ITD Studio"><button class="icon-button" data-action="close-menu" aria-label="Закрыть меню">'+icon('x')+'</button></div><nav class="sidebar-nav">'+navHTML()+'</nav><div class="drawer-footer"><p class="fine">Демонстрационная концепция.<br>Рабочий сайт не изменён.</p></div></div>';d.hidden=false;d.classList.add('open');d.querySelector('button').focus();break}case'close-menu':closeDrawer();break;case'contact':switchView('material');document.querySelector('.discussion')?.scrollIntoView();document.getElementById('comment-text')?.focus();break;case'all-waiting':infoModal('Ждём заказчика · 5 материалов','Квартира у парка — визуализация гостиной<br>Дом в соснах — планировка<br>Студия на набережной — отделка<br>Квартира на холме — освещение<br>Дом у озера — концепция');break;case'task':infoModal('Рабочая задача',taskData[Number(t.dataset.index)||0].title+'<br><br>Ответственный и срок показаны в рабочей очереди. Изменения в рабочую систему из макета не отправляются.');break;case'new-task':infoModal('Новая задача','Визуальная концепция показывает расположение действия. Создание задач подключается на этапе реализации.');break;case'stage':infoModal('Этапы проекта','Сейчас параллельно идут визуализации и рабочая документация.<br><br>Требуется одно решение по визуализации гостиной.');break;}});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});document.getElementById('drawer').addEventListener('click',e=>{if(e.target.id==='drawer')closeDrawer()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeDrawer();document.getElementById('notifications').hidden=true}if(e.key==='Tab'&&!document.getElementById('modal').hidden){const items=[...document.querySelectorAll('#modal button,#modal textarea,#modal input')].filter(x=>!x.disabled);const first=items[0],last=items.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
window.addEventListener('hashchange',()=>{const s=location.hash.slice(1);if(['client','admin','material'].includes(s))switchView(s)});render();
</script>
</body></html>
